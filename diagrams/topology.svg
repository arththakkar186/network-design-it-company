<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>NorthBridge Technologies (fictional) - HQ and branch network topology</title>
  <defs>
    <style>
      .dev{fill:#eef4fb;stroke:#2f5d8a;stroke-width:1.6}
      .rtr{fill:#e8f5ec;stroke:#2e7d4f;stroke-width:1.6}
      .fw{fill:#fdf0e6;stroke:#b5651d;stroke-width:1.6}
      .end{fill:#f6f6f6;stroke:#888;stroke-width:1.2}
      .hub{fill:#fff6d6;stroke:#a68300;stroke-width:1.6}
      .zone{fill:none;stroke:#9aa7b4;stroke-dasharray:6 5;stroke-width:1.2}
      .l{stroke:#2f5d8a;stroke-width:2;fill:none}
      .l3{stroke:#2e7d4f;stroke-width:2.4;fill:none}
      .po{stroke:#6a1b9a;stroke-width:5;fill:none}
      .vpn{stroke:#b5651d;stroke-width:2.4;stroke-dasharray:9 6;fill:none}
      .thin{stroke:#888;stroke-width:1.2;fill:none}
      .t{fill:#1f2933}
      .b{font-weight:600}
      .s{font-size:11px;fill:#52606d}
      .zl{font-size:12px;fill:#52606d;font-weight:600;letter-spacing:.04em}
    </style>
  </defs>
  <rect width="1240" height="860" fill="#ffffff"/>

  <!-- zones -->
  <rect class="zone" x="20" y="140" width="800" height="700" rx="10"/>
  <text class="zl" x="34" y="828">HEAD OFFICE (10.10.0.0/16)</text>
  <rect class="zone" x="860" y="140" width="360" height="460" rx="10"/>
  <text class="zl" x="874" y="588">BRANCH OFFICE (10.20.0.0/16)</text>

  <!-- internet -->
  <path d="M560 70 a38 30 0 0 1 70 -22 a44 34 0 0 1 82 6 a34 28 0 0 1 22 52 h-190 a30 26 0 0 1 16 -36z" fill="#f2f4f7" stroke="#7b8794" stroke-width="1.4"/>
  <text class="t b" x="640" y="92" text-anchor="middle">Internet / ISP</text>

  <!-- WAN links -->
  <path class="l3" d="M420 160 L585 108"/>
  <text class="s" x="330" y="128">G0/0/0 203.0.113.2/30</text>
  <path class="l3" d="M1040 160 L728 108"/>
  <text class="s" x="880" y="122">G0/0/0 198.51.100.2/30</text>
  <path class="vpn" d="M470 178 C 640 150, 820 150, 990 178"/>
  <text class="s" x="700" y="200" text-anchor="middle" fill="#b5651d">Tunnel0 GRE over IPsec 172.16.0.0/30</text>
  <text class="s" x="700" y="214" text-anchor="middle" fill="#b5651d">AES-256 · OSPF area 0 across the tunnel</text>

  <!-- R-EDGE -->
  <rect class="fw" x="340" y="160" width="160" height="56" rx="8"/>
  <text class="t b" x="420" y="182" text-anchor="middle">R-EDGE</text>
  <text class="s" x="420" y="198" text-anchor="middle">ISR 4331 · NAT · ZBF · VPN</text>
  <text class="s" x="420" y="211" text-anchor="middle">Lo0 10.10.254.1</text>

  <!-- uplinks to cores -->
  <path class="l3" d="M380 216 L250 300"/>
  <path class="l3" d="M460 216 L590 300"/>
  <text class="s" x="214" y="262">10.10.255.0/30</text>
  <text class="s" x="540" y="262">10.10.255.4/30</text>

  <!-- cores -->
  <rect class="rtr" x="160" y="300" width="180" height="62" rx="8"/>
  <text class="t b" x="250" y="322" text-anchor="middle">CORE1</text>
  <text class="s" x="250" y="338" text-anchor="middle">Catalyst 3650 · L3 · HSRP</text>
  <text class="s" x="250" y="352" text-anchor="middle">active 10,20,40,60,80 · STP root</text>

  <rect class="rtr" x="500" y="300" width="180" height="62" rx="8"/>
  <text class="t b" x="590" y="322" text-anchor="middle">CORE2</text>
  <text class="s" x="590" y="338" text-anchor="middle">Catalyst 3650 · L3 · HSRP</text>
  <text class="s" x="590" y="352" text-anchor="middle">active 25,30,50,70,90 · STP root</text>

  <path class="po" d="M340 331 L500 331"/>
  <text class="s" x="420" y="322" text-anchor="middle">Po1 LACP 2×1G trunk</text>

  <!-- access switches -->
  <g>
    <rect class="dev" x="40"  y="480" width="160" height="54" rx="8"/>
    <text class="t b" x="120" y="502" text-anchor="middle">ACC-F1-01</text>
    <text class="s"   x="120" y="518" text-anchor="middle">2960 · Floor 1 IDF</text>
    <rect class="dev" x="230" y="480" width="160" height="54" rx="8"/>
    <text class="t b" x="310" y="502" text-anchor="middle">ACC-F2-01</text>
    <text class="s"   x="310" y="518" text-anchor="middle">2960 · Floor 2 IDF</text>
    <rect class="dev" x="420" y="480" width="160" height="54" rx="8"/>
    <text class="t b" x="500" y="502" text-anchor="middle">ACC-F3-01</text>
    <text class="s"   x="500" y="518" text-anchor="middle">2960 · Floor 3 IDF</text>
    <rect class="dev" x="610" y="480" width="180" height="54" rx="8"/>
    <text class="t b" x="700" y="502" text-anchor="middle">ACC-DC-01</text>
    <text class="s"   x="700" y="518" text-anchor="middle">2960 · Server room MDF</text>
  </g>
  <!-- dual-homed trunks -->
  <g class="l">
    <path d="M200 362 L120 480"/><path d="M540 362 L130 480"/>
    <path d="M230 362 L300 480"/><path d="M560 362 L320 480"/>
    <path d="M270 362 L490 480"/><path d="M590 362 L510 480"/>
    <path d="M320 362 L690 480"/><path d="M640 362 L710 480"/>
  </g>

  <!-- endpoints F1 -->
  <path class="thin" d="M80 534 L70 600"/><path class="thin" d="M120 534 L120 600"/><path class="thin" d="M160 534 L170 600"/>
  <rect class="end" x="36"  y="600" width="64" height="42" rx="5"/><text class="s" x="68"  y="618" text-anchor="middle">PCs</text><text class="s" x="68" y="632" text-anchor="middle">V20 / V30</text>
  <rect class="end" x="104" y="600" width="44" height="42" rx="5"/><text class="s" x="126" y="618" text-anchor="middle">IP</text><text class="s" x="126" y="632" text-anchor="middle">phone</text>
  <rect class="end" x="152" y="600" width="44" height="42" rx="5"/><text class="s" x="174" y="618" text-anchor="middle">AP</text><text class="s" x="174" y="632" text-anchor="middle">V10</text>

  <!-- endpoints F2 -->
  <path class="thin" d="M280 534 L270 600"/><path class="thin" d="M310 534 L320 600"/><path class="thin" d="M350 534 L366 600"/>
  <rect class="end" x="236" y="600" width="64" height="42" rx="5"/><text class="s" x="268" y="618" text-anchor="middle">PCs</text><text class="s" x="268" y="632" text-anchor="middle">V40</text>
  <rect class="end" x="304" y="600" width="44" height="42" rx="5"/><text class="s" x="326" y="618" text-anchor="middle">IP</text><text class="s" x="326" y="632" text-anchor="middle">phone</text>
  <rect class="end" x="352" y="600" width="44" height="42" rx="5"/><text class="s" x="374" y="618" text-anchor="middle">AP</text><text class="s" x="374" y="632" text-anchor="middle">V10</text>

  <!-- endpoints F3 with hub -->
  <path class="thin" d="M450 534 L446 600"/><path class="thin" d="M500 534 L520 600"/><path class="thin" d="M560 534 L572 600"/>
  <rect class="end" x="414" y="600" width="64" height="42" rx="5"/><text class="s" x="446" y="618" text-anchor="middle">PCs</text><text class="s" x="446" y="632" text-anchor="middle">V40 / V25</text>
  <rect class="hub" x="484" y="600" width="72" height="42" rx="5"/><text class="t b" x="520" y="618" text-anchor="middle" font-size="12">HUB</text><text class="s" x="520" y="632" text-anchor="middle">V90 · half-dx</text>
  <rect class="end" x="560" y="600" width="40" height="42" rx="5"/><text class="s" x="580" y="625" text-anchor="middle">AP</text>
  <path class="thin" d="M500 642 L470 700"/><path class="thin" d="M520 642 L520 700"/><path class="thin" d="M540 642 L570 700"/>
  <rect class="end" x="446" y="700" width="48" height="34" rx="5"/><text class="s" x="470" y="721" text-anchor="middle">Lab 1</text>
  <rect class="end" x="496" y="700" width="48" height="34" rx="5"/><text class="s" x="520" y="721" text-anchor="middle">Lab 2</text>
  <rect class="end" x="546" y="700" width="48" height="34" rx="5"/><text class="s" x="570" y="721" text-anchor="middle">Lab n</text>
  <text class="s" x="520" y="752" text-anchor="middle">one collision domain, internet-only ACL</text>

  <!-- DC -->
  <path class="thin" d="M650 534 L652 600"/><path class="thin" d="M700 534 L720 600"/><path class="thin" d="M760 534 L776 600"/>
  <rect class="end" x="606" y="600" width="84" height="66" rx="5"/>
  <text class="s" x="648" y="616" text-anchor="middle">DC01/DC02</text><text class="s" x="648" y="630" text-anchor="middle">NPS01</text><text class="s" x="648" y="644" text-anchor="middle">FS01 WEB01</text><text class="s" x="648" y="658" text-anchor="middle">MAIL01 MON01</text>
  <rect class="end" x="694" y="600" width="56" height="42" rx="5"/><text class="s" x="720" y="618" text-anchor="middle">WLC01</text><text class="s" x="720" y="632" text-anchor="middle">V10,70,80</text>
  <rect class="end" x="756" y="600" width="50" height="42" rx="5"/><text class="s" x="781" y="618" text-anchor="middle">iLO /</text><text class="s" x="781" y="632" text-anchor="middle">iDRAC</text>
  <text class="s" x="700" y="690" text-anchor="middle">VLAN 50 10.10.50.0/26</text>

  <!-- branch -->
  <rect class="fw" x="960" y="160" width="160" height="56" rx="8"/>
  <text class="t b" x="1040" y="182" text-anchor="middle">R-BR</text>
  <text class="s" x="1040" y="198" text-anchor="middle">ISR 4321 · NAT · ZBF · VPN</text>
  <text class="s" x="1040" y="211" text-anchor="middle">router-on-a-stick</text>
  <path class="l" d="M1040 216 L1040 330"/>
  <text class="s" x="1048" y="280">G0/0/1 trunk .110 .120 .160</text>
  <rect class="dev" x="960" y="330" width="160" height="54" rx="8"/>
  <text class="t b" x="1040" y="352" text-anchor="middle">SW-BR-01</text>
  <text class="s" x="1040" y="368" text-anchor="middle">2960 · 24 ports</text>
  <path class="thin" d="M1000 384 L990 450"/><path class="thin" d="M1080 384 L1090 450"/>
  <rect class="end" x="950" y="450" width="80" height="42" rx="5"/><text class="s" x="990" y="468" text-anchor="middle">PCs</text><text class="s" x="990" y="482" text-anchor="middle">V120</text>
  <rect class="end" x="1050" y="450" width="80" height="42" rx="5"/><text class="s" x="1090" y="468" text-anchor="middle">IP phones</text><text class="s" x="1090" y="482" text-anchor="middle">V160</text>
  <text class="s" x="1040" y="530" text-anchor="middle">Local internet breakout;</text>
  <text class="s" x="1040" y="544" text-anchor="middle">DHCP, DNS, file and mail</text>
  <text class="s" x="1040" y="558" text-anchor="middle">served from HQ over the tunnel</text>

  <!-- legend -->
  <g transform="translate(860,640)">
    <rect x="0" y="0" width="360" height="190" rx="8" fill="#fafbfc" stroke="#d0d7de"/>
    <text class="t b" x="14" y="24">Legend</text>
    <path class="l3" d="M14 46 h46"/><text class="s" x="70" y="50">Routed L3 link (OSPF)</text>
    <path class="l" d="M14 70 h46"/><text class="s" x="70" y="74">802.1Q trunk</text>
    <path class="po" d="M14 94 h46"/><text class="s" x="70" y="98">EtherChannel (LACP)</text>
    <path class="vpn" d="M14 118 h46"/><text class="s" x="70" y="122">Site-to-site VPN</text>
    <path class="thin" d="M14 142 h46"/><text class="s" x="70" y="146">Access port (FastEthernet)</text>
    <rect class="hub" x="14" y="158" width="46" height="18" rx="3"/><text class="s" x="70" y="172">Legacy hub (shared collision domain)</text>
  </g>
</svg>
