!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
! R-BR  |  ISR 4321 branch router: router-on-a-stick, NAT, ZBF, VPN to HQ
! NorthBridge Technologies (fictional)
! Generated by tools/render.py from design/network.json. Do not edit by hand.
! Replace every CHANGE_ME before deployment. Then: crypto key generate rsa modulus 2048
!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
!
version 15.2
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
!
hostname R-BR
!
no ip domain-lookup
ip domain-name corp.northbridge.example
!
enable algorithm-type scrypt secret CHANGE_ME
username netadmin privilege 15 algorithm-type scrypt secret CHANGE_ME
!
aaa new-model
aaa group server radius NPS
 server name NPS01
aaa authentication login default group NPS local
aaa authorization exec default group NPS local if-authenticated
aaa accounting exec default start-stop group NPS
!
radius server NPS01
 address ipv4 10.10.50.12 auth-port 1812 acct-port 1813
 key CHANGE_ME
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
login block-for 120 attempts 5 within 60
!
clock timezone EST -5 0
clock summer-time EDT recurring
!
crypto isakmp policy 10
 encryption aes 256
 hash sha256
 authentication pre-share
 group 14
 lifetime 86400
crypto isakmp key CHANGE_ME address 203.0.113.2
crypto isakmp keepalive 10 3
!
crypto ipsec transform-set TS-AES256 esp-aes 256 esp-sha256-hmac
 mode transport
!
crypto ipsec profile VPN-HQ-BRANCH
 set transform-set TS-AES256
 set pfs group14
!
zone security INSIDE
zone security OUTSIDE
!
class-map type inspect match-any CM-INSIDE-TO-OUT
 match protocol tcp
 match protocol udp
 match protocol icmp
policy-map type inspect PM-INSIDE-TO-OUT
 class type inspect CM-INSIDE-TO-OUT
  inspect
 class class-default
  drop log
!
ip access-list extended ACL-VPN-PEER
 permit udp host 203.0.113.2 any eq isakmp
 permit udp host 203.0.113.2 any eq non500-isakmp
 permit esp host 203.0.113.2 any
class-map type inspect match-any CM-OUT-TO-SELF
 match access-group name ACL-VPN-PEER
policy-map type inspect PM-OUT-TO-SELF
 class type inspect CM-OUT-TO-SELF
  pass
 class class-default
  drop log
!
zone-pair security ZP-IN-OUT source INSIDE destination OUTSIDE
 service-policy type inspect PM-INSIDE-TO-OUT
zone-pair security ZP-OUT-SELF source OUTSIDE destination self
 service-policy type inspect PM-OUT-TO-SELF
!
interface Loopback0
 ip address 10.20.254.1 255.255.255.255
!
interface GigabitEthernet0/0/0
 description INTERNET - ISP handoff (documentation range)
 ip address 198.51.100.2 255.255.255.252
 ip nat outside
 zone-member security OUTSIDE
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 no cdp enable
!
interface GigabitEthernet0/0/1
 description TRUNK to SW-BR-01 GigabitEthernet0/1
 no ip address
!
interface GigabitEthernet0/0/1.999
 description BLACKHOLE native VLAN (no IP)
 encapsulation dot1Q 999 native
!
interface GigabitEthernet0/0/1.110
 description BR-MGMT - Branch management
 encapsulation dot1Q 110
 ip address 10.20.10.1 255.255.255.0
 ip nat inside
 zone-member security INSIDE
!
interface GigabitEthernet0/0/1.120
 description BR-STAFF - Branch workstations
 encapsulation dot1Q 120
 ip address 10.20.20.1 255.255.255.0
 ip helper-address 10.10.50.10
 ip helper-address 10.10.50.11
 ip nat inside
 zone-member security INSIDE
!
interface GigabitEthernet0/0/1.160
 description BR-VOICE - Branch IP phones
 encapsulation dot1Q 160
 ip address 10.20.60.1 255.255.255.0
 ip helper-address 10.10.50.10
 ip helper-address 10.10.50.11
 ip nat inside
 zone-member security INSIDE
!
interface Tunnel0
 description GRE over IPsec to R-EDGE (HQ)
 ip address 172.16.0.2 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
 ip ospf network point-to-point
 ip ospf hello-interval 10
 tunnel source GigabitEthernet0/0/0
 tunnel destination 203.0.113.2
 tunnel protection ipsec profile VPN-HQ-BRANCH
 zone-member security INSIDE
!
ip access-list extended NAT-INSIDE
 remark Local internet breakout; HQ-bound traffic stays inside the tunnel
 deny   ip 10.20.0.0 0.0.255.255 10.10.0.0 0.0.255.255
 permit ip 10.20.0.0 0.0.255.255 any
!
ip nat inside source list NAT-INSIDE interface GigabitEthernet0/0/0 overload
!
! Static default (AD 1) keeps internet local even though HQ originates a default into OSPF (AD 110).
ip route 0.0.0.0 0.0.0.0 198.51.100.1 name ISP-DEFAULT
!
router ospf 1
 router-id 10.20.254.1
 auto-cost reference-bandwidth 10000
 passive-interface default
 no passive-interface Tunnel0
 network 10.20.254.1 0.0.0.0 area 0
 network 172.16.0.0 0.0.0.3 area 0
 network 10.20.10.0 0.0.0.255 area 0
 network 10.20.20.0 0.0.0.255 area 0
 network 10.20.60.0 0.0.0.255 area 0
!
!
ip access-list standard VTY-ALLOWED
 remark Only IT-OPS and the management VLAN may open SSH sessions
 permit 10.10.25.0 0.0.0.63
 permit 10.10.10.0 0.0.0.255
 deny any log
!
logging source-interface Loopback0
logging host 10.10.50.50
logging trap informational
logging buffered 64000
ntp source Loopback0
ntp server 10.10.50.50 prefer
!
snmp-server group NETOPS v3 priv read NETOPS-VIEW access SNMP-ALLOWED
snmp-server view NETOPS-VIEW iso included
snmp-server user nms NETOPS v3 auth sha CHANGE_ME priv aes 128 CHANGE_ME
snmp-server host 10.10.50.50 version 3 priv nms
ip access-list standard SNMP-ALLOWED
 permit host 10.10.50.50
!
banner motd ^
  AUTHORIZED ACCESS ONLY. Activity on this device is logged and monitored.
  Disconnect now if you are not an authorized NorthBridge administrator.
^
!
line con 0
 exec-timeout 10 0
 logging synchronous
line vty 0 15
 access-class VTY-ALLOWED in
 exec-timeout 10 0
 transport input ssh
 logging synchronous
!
end
