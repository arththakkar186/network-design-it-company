!
version 15.2
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
!
hostname ACC-F3-01
!
no ip domain-lookup
ip domain-name corp.northbridge.example
!
enable algorithm-type scrypt secret CHANGE_ME
username netadmin privilege 15 algorithm-type scrypt secret CHANGE_ME
!
aaa new-model
aaa group server radius NPS
 server name NPS01
aaa authentication login default group NPS local
aaa authorization exec default group NPS local if-authenticated
aaa accounting exec default start-stop group NPS
!
radius server NPS01
 address ipv4 10.10.50.12 auth-port 1812 acct-port 1813
 key CHANGE_ME
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
login block-for 120 attempts 5 within 60
!
clock timezone EST -5 0
clock summer-time EDT recurring
!
vtp mode transparent
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree portfast bpduguard default
errdisable recovery cause bpduguard psecure-violation
errdisable recovery interval 300
!
vlan 10
 name MGMT
vlan 25
 name IT-OPS
vlan 40
 name ENGINEERING
vlan 60
 name VOICE
vlan 90
 name LAB-HUB
vlan 999
 name BLACKHOLE
!
ip dhcp snooping
ip dhcp snooping vlan 25,40,60,90
no ip dhcp snooping information option
ip arp inspection vlan 25,40,60,90
!
mls qos
!
interface GigabitEthernet0/1
 description UPLINK to CORE1 GigabitEthernet1/0/4
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,25,40,60,90
 ip dhcp snooping trust
 ip arp inspection trust
!
interface GigabitEthernet0/2
 description UPLINK to CORE2 GigabitEthernet1/0/4
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,25,40,60,90
 ip dhcp snooping trust
 ip arp inspection trust
!
interface range FastEthernet0/1-12
 description ENGINEERING desks
 switchport mode access
 switchport nonegotiate
 switchport access vlan 40
 switchport voice vlan 60
 mls qos trust device cisco-phone
 mls qos trust cos
 spanning-tree portfast
 switchport port-security
 switchport port-security maximum 3
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 ip dhcp snooping limit rate 15
!
interface range FastEthernet0/13-18
 description IT-OPS desks
 switchport mode access
 switchport nonegotiate
 switchport access vlan 25
 switchport voice vlan 60
 mls qos trust device cisco-phone
 mls qos trust cos
 spanning-tree portfast
 switchport port-security
 switchport port-security maximum 3
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 ip dhcp snooping limit rate 15
!
interface range FastEthernet0/19
 description Uplink to training-lab hub (shared collision domain)
 switchport mode access
 switchport nonegotiate
 switchport access vlan 90
 ! A hub is half duplex and shares one collision domain across all lab PCs.
 ! Speed/duplex are forced so the switch never negotiates a duplex mismatch.
 speed 100
 duplex half
 spanning-tree portfast
 switchport port-security
 switchport port-security maximum 12
 switchport port-security violation restrict
 ip dhcp snooping limit rate 30
!
interface range FastEthernet0/20-21
 description Lightweight AP (CAPWAP to WLC)
 switchport mode access
 switchport nonegotiate
 switchport access vlan 10
 spanning-tree portfast
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation restrict
!
interface range FastEthernet0/22-24
 description UNUSED - administratively down
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
interface Vlan10
 description Management
 ip address 10.10.10.13 255.255.255.0
 no shutdown
!
ip default-gateway 10.10.10.1
!
ip access-list standard VTY-ALLOWED
 remark Only IT-OPS and the management VLAN may open SSH sessions
 permit 10.10.25.0 0.0.0.63
 permit 10.10.10.0 0.0.0.255
 deny any log
!
logging source-interface Vlan10
logging host 10.10.50.50
logging trap informational
logging buffered 64000
ntp source Vlan10
ntp server 10.10.50.50 prefer
!
snmp-server group NETOPS v3 priv read NETOPS-VIEW access SNMP-ALLOWED
snmp-server view NETOPS-VIEW iso included
snmp-server user nms NETOPS v3 auth sha CHANGE_ME priv aes 128 CHANGE_ME
snmp-server host 10.10.50.50 version 3 priv nms
ip access-list standard SNMP-ALLOWED
 permit host 10.10.50.50
!
banner motd ^
  AUTHORIZED ACCESS ONLY. Activity on this device is logged and monitored.
  Disconnect now if you are not an authorized NorthBridge administrator.
^
!
line con 0
 exec-timeout 10 0
 logging synchronous
line vty 0 15
 access-class VTY-ALLOWED in
 exec-timeout 10 0
 transport input ssh
 logging synchronous
!
end
