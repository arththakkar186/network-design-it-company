!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
!
version 15.2
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
!
hostname CORE1
!
no ip domain-lookup
ip domain-name corp.northbridge.example
!
enable algorithm-type scrypt secret CHANGE_ME
username netadmin privilege 15 algorithm-type scrypt secret CHANGE_ME
!
aaa new-model
aaa group server radius NPS
 server name NPS01
aaa authentication login default group NPS local
aaa authorization exec default group NPS local if-authenticated
aaa accounting exec default start-stop group NPS
!
radius server NPS01
 address ipv4 10.10.50.12 auth-port 1812 acct-port 1813
 key CHANGE_ME
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
login block-for 120 attempts 5 within 60
!
clock timezone EST -5 0
clock summer-time EDT recurring
!
ip routing
!
vtp mode transparent
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree portfast bpduguard default
errdisable recovery cause bpduguard psecure-violation
errdisable recovery interval 300
!
vlan 10
 name MGMT
vlan 20
 name ADMIN-HR
vlan 25
 name IT-OPS
vlan 30
 name SALES
vlan 40
 name ENGINEERING
vlan 50
 name SERVERS
vlan 60
 name VOICE
vlan 70
 name WIFI-CORP
vlan 80
 name WIFI-GUEST
vlan 90
 name LAB-HUB
vlan 999
 name BLACKHOLE
!
!
spanning-tree vlan 10,20,40,60,80 priority 24576
spanning-tree vlan 25,30,50,70,90 priority 28672
! STP root follows the HSRP active gateway so traffic never crosses the core
! interlink just to reach its default gateway.
!
track 1 interface GigabitEthernet1/0/1 line-protocol
!
interface Loopback0
 ip address 10.10.254.2 255.255.255.255
!
interface GigabitEthernet1/0/1
 description ROUTED UPLINK to R-EDGE GigabitEthernet0/0/1
 no switchport
 ip address 10.10.255.2 255.255.255.252
 ip ospf network point-to-point
!
interface range GigabitEthernet1/0/23 , GigabitEthernet1/0/24
 description INTERLINK to CORE2 (LACP)
 switchport mode trunk
 channel-group 1 mode active
!
interface Port-channel1
 description INTERLINK to CORE2
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,25,30,40,50,60,70,80,90
!
interface GigabitEthernet1/0/2
 description DOWNLINK to ACC-F1-01 GigabitEthernet0/1
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,25,30,40,50,60,70,80,90
!
interface GigabitEthernet1/0/3
 description DOWNLINK to ACC-F2-01 GigabitEthernet0/1
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,25,30,40,50,60,70,80,90
!
interface GigabitEthernet1/0/4
 description DOWNLINK to ACC-F3-01 GigabitEthernet0/1
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,25,30,40,50,60,70,80,90
!
interface GigabitEthernet1/0/5
 description DOWNLINK to ACC-DC-01 GigabitEthernet0/1
 switchport mode trunk
 switchport nonegotiate
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,25,30,40,50,60,70,80,90
!
ip access-list extended INTERNET-ONLY-IN
 remark Applied inbound on guest and lab SVIs: reach DHCP, then internet only
 permit udp any host 10.10.50.10 eq bootps
 permit udp any host 10.10.50.11 eq bootps
 permit udp any eq bootpc any eq bootps
 deny   ip any 10.0.0.0 0.255.255.255 log
 deny   ip any 172.16.0.0 0.15.255.255 log
 deny   ip any 192.168.0.0 0.0.255.255 log
 permit ip any any
!
ip access-list extended MGMT-PROTECT-OUT
 remark Applied outbound on the MGMT SVI: who may talk TO management addresses
 permit ip 10.10.25.0 0.0.0.63 any
 permit ip 10.10.10.0 0.0.0.255 any
 permit ip 10.10.50.0 0.0.0.63 any
 permit ip 10.20.10.0 0.0.0.255 any
 permit icmp any any echo-reply
 permit icmp any any unreachable
 permit icmp any any time-exceeded
 deny   ip any any log
!
interface Vlan1
 no ip address
 shutdown
!
